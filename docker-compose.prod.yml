name: rawijli-prod

services:
  mysql:
    image: mysql:8.4
    container_name: rawijli-prod-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rawijli}
      MYSQL_USER: ${DB_USERNAME:-rawijli}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rawijli_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rawijli_root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rawijli_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: rawijli-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rawijli-prod-app
    restart: unless-stopped
    environment:
      APP_NAME: Rawijli
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      RUN_MIGRATIONS: "true"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-rawijli}
      DB_USERNAME: ${DB_USERNAME:-rawijli}
      DB_PASSWORD: ${DB_PASSWORD:-rawijli_secret}

      SESSION_DRIVER: redis
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_DOMAIN: "null"

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      FILESYSTEM_DISK: local
      MEDIA_DISK: public

      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@rawijli.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Rawijli}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_storage:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rawijli-prod-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles: ["tunnel"]

volumes:
  mysql_data:
  redis_data:
  app_storage:
